# Aystec Remoto: cliente de RustDesk para Windows x64 apuntando al servidor de Aystec.
#
# Copia reducida de flutter-build.yml (job build-for-windows-flutter, solo x64), que compila
# todas las plataformas sin opcion para elegir. Diferencias:
#   - Solo Windows x64; sin firma, sin MSI, sin publicar releases (el resultado queda como
#     artefacto de la corrida).
#   - "Aystec: servidor y llave": en 1.5.3 el servidor y la llave son constantes fijas en
#     libs/hbb_common/src/config.rs (las variables RENDEZVOUS_SERVER/RS_PUB_KEY ya no se
#     leen al compilar). El paso las reemplaza y falla si no encuentra las originales.
#   - El mismo paso cambia APP_NAME a AystecRemoto (cliente con marca: servicio, carpeta,
#     protocolo aystecremoto:// y textos de la interfaz; RustDesk lo trata como cliente
#     personalizado y no busca actualizaciones propias).
#   - "Aystec: verificar binario": falla si librustdesk.dll no trae el servidor y la llave.
#   - Iconos y metadatos del exe ya vienen en la rama (ver commits "Aystec Remoto: marca").
#
# AGPL-3.0: este fork es publico (github.com/Chewv20/rustdesk).

name: Aystec Remoto - Windows x64

on:
  workflow_dispatch:

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.3"
  AYSTEC_SERVIDOR: "aystec-remoto.ddns.net"
  AYSTEC_LLAVE: "tc41fObqbhAUSNWJget6kl6TDUiEfNpNR3RyS1tEKXc="
  # Nombre interno: servicio de Windows, carpeta y exe en Program Files, protocolo
  # aystecremoto:// y registro. Sin espacios (el protocolo seria invalido).
  AYSTEC_APP: "AystecRemoto"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows-x64:
    name: x86_64-pc-windows-msvc
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: "Aystec: servidor, llave y nombre"
        shell: bash
        run: |
          f=libs/hbb_common/src/config.rs
          grep -qxF '    pub static ref APP_NAME: RwLock<String> = RwLock::new("RustDesk".to_owned());' "$f" \
            || { echo "No se encontro APP_NAME original en $f"; exit 1; }
          sed -i "s|^    pub static ref APP_NAME: RwLock<String> = RwLock::new(\"RustDesk\".to_owned());|    pub static ref APP_NAME: RwLock<String> = RwLock::new(\"${AYSTEC_APP}\".to_owned());|" "$f"
          grep -qxF "    pub static ref APP_NAME: RwLock<String> = RwLock::new(\"${AYSTEC_APP}\".to_owned());" "$f" || { echo "El reemplazo de APP_NAME fallo"; exit 1; }
          grep -qx 'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\["rs-ny.rustdesk.com"\];' "$f" \
            || { echo "No se encontro RENDEZVOUS_SERVERS original en $f"; exit 1; }
          grep -qx 'pub const RS_PUB_KEY: &str = "OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=";' "$f" \
            || { echo "No se encontro RS_PUB_KEY original en $f"; exit 1; }
          sed -i "s|^pub const RENDEZVOUS_SERVERS: .*|pub const RENDEZVOUS_SERVERS: \&[\&str] = \&[\"${AYSTEC_SERVIDOR}\"];|" "$f"
          sed -i "s|^pub const RS_PUB_KEY: .*|pub const RS_PUB_KEY: \&str = \"${AYSTEC_LLAVE}\";|" "$f"
          grep -qxF "pub const RENDEZVOUS_SERVERS: &[&str] = &[\"${AYSTEC_SERVIDOR}\"];" "$f" || { echo "El reemplazo del servidor fallo"; exit 1; }
          grep -qxF "pub const RS_PUB_KEY: &str = \"${AYSTEC_LLAVE}\";" "$f" || { echo "El reemplazo de la llave fallo"; exit 1; }
          grep -n 'RENDEZVOUS_SERVERS\|RS_PUB_KEY' "$f" | head -4

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums
            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } else {
                Write-Output "Printer driver checksums do not match, ignore the files."
            }
          } catch {
              Write-Host "Ignore the printer driver error."
          }

      - name: "Aystec: verificar binario"
        shell: powershell
        run: |
          $dll = Get-ChildItem ./rustdesk -Recurse -Filter librustdesk.dll | Select-Object -First 1
          if (-not $dll) { throw 'No se encontro librustdesk.dll' }
          $bytes = [IO.File]::ReadAllBytes($dll.FullName)
          $texto = [Text.Encoding]::ASCII.GetString($bytes)
          # APP_NAME no se busca aqui: una cadena corta ("AystecRemoto".to_owned()) el
          # compilador la convierte en valores inmediatos y no queda contigua en el binario.
          # Su reemplazo ya se verifico en el codigo fuente ("Aystec: servidor, llave y nombre").
          foreach ($v in $env:AYSTEC_SERVIDOR, $env:AYSTEC_LLAVE) {
            if (-not $texto.Contains($v)) { throw "librustdesk.dll no contiene '$v'" }
          }
          if ($texto.Contains('OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=')) { Write-Warning 'librustdesk.dll tambien contiene la llave publica de RustDesk (revisar donde)' }
          Write-Host "OK: librustdesk.dll trae el servidor y la llave de Aystec"

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" != "" ]; then
            cp $runner_res ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/aystec-remoto-${{ env.VERSION }}-x86_64.exe
          sha256sum ./SignOutput/*.exe

      - name: Upload exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aystec-remoto-windows-x86_64
          path: ./SignOutput/aystec-remoto-${{ env.VERSION }}-x86_64.exe
          if-no-files-found: error

      - name: Upload unpacked
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aystec-remoto-windows-x86_64-carpeta
          path: rustdesk
